name: Build History Duo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract ZIP
        run: unzip -o history_duo_stage8.zip

      - name: Build APK
        working-directory: history_duo_stage7_work/app_src
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: History-Duo-APK
          path: history_duo_stage7_work/app_src/build/app/outputs/flutter-apk/app-release.apk
